[package]
name = "gitbuddy"
version = "0.1.0"
edition = "2024"
description = "A native Git workspace built with Rust and GPUI Kit"
license = "MIT"

[dependencies]
gpui-kit = "=0.6.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", features = ["https", "ssh"] }
chrono = "0.4"
async-channel = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Keep line tables so panic backtraces stay usable; full debug info is too slow.
debug = "line-tables-only"
incremental = true
