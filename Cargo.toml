[package]
name = "gitbuddy"
version = "0.1.0"
edition = "2024"
description = "A native Git workspace built with Rust and GPUI Kit"
license = "MIT"

[dependencies]
gpui-kit = "=0.6.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", features = ["https", "ssh"] }
gix-attributes = { version = "0.37.1", default-features = false }
gix-filter = { version = "=0.36.1", default-features = false, features = ["sha1"] }
chrono = "0.4"
async-channel = "2"
sha2 = "0.10"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
semver = "1.0.28"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

tempfile = "3"

[profile.dev]
# Keep line tables so panic backtraces stay usable; full debug info is too slow.
debug = "line-tables-only"
incremental = true
